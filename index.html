<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17796D"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rutin"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png"><title>Günlük Rutin</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column. Sticky date header on top, five-tab bar at the bottom.
   "Bugün" mirrors the printed sheet (routine | tracking) in two balanced columns from ~760px.
   "Hafta" and "Ay" are the printed grids with a sticky label column and a Toplam column.
   "Rozetler" is a growth path: seed to fruiting tree, seven medallions. */
:root{
  --bg:#F0F5F5; --surface:#FFFFFF; --surface-2:#E3F0ED; --ink:#12303D; --ink-2:#4F6877;
  --line:#D3DFE1; --line-2:#A9BEC3; --accent:#17796D; --accent-ink:#FFFFFF; --accent-soft:#D3EDE8;
  --field:#F5F1E7; --we:#F5F8F8; --today-tint:#EAF6F3; --warn:#9A5A0B; --danger:#B03A2A;
  --shadow:0 1px 2px rgba(18,48,61,.07);
  --b-sky1:#BFE6DE; --b-sky2:#F2F9F2; --b-hill:#A9D8A8; --b-soil1:#946248; --b-soil2:#5F3F2D; --b-soil-hi:#B58463;
  --b-leaf1:#7CCB6E; --b-leaf2:#2F8A55; --b-trunk1:#A87550; --b-trunk2:#6E4730; --b-seed:#C28A45;
  --b-fruit:#E2562B; --b-bloom:#FBD1DC; --b-ring1:#EFCB6F; --b-ring2:#C68A22; --b-ringin:#FFFBF1; --b-sun:#F7C95C;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A21; --surface:#15252E; --surface-2:#1B3440; --ink:#E4EEF0; --ink-2:#9BB2BB;
    --line:#26404B; --line-2:#44616D; --accent:#4DC2B1; --accent-ink:#06281F; --accent-soft:#1B4744;
    --field:#1D2C31; --we:#182A33; --today-tint:#173B3C; --warn:#E0A85A; --danger:#EF8A7A; --shadow:none;
    --b-sky1:#1D4850; --b-sky2:#2E6460; --b-hill:#2F6B55; --b-soil1:#7B503A; --b-soil2:#4A3125; --b-soil-hi:#946248;
    --b-leaf1:#86D88A; --b-leaf2:#3FA169; --b-trunk1:#B98258; --b-trunk2:#7E5338; --b-seed:#D19A52;
    --b-fruit:#F0703F; --b-bloom:#F7B9C9; --b-ring1:#F1CF78; --b-ring2:#D09A33; --b-ringin:#112830; --b-sun:#F5C95F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A21; --surface:#15252E; --surface-2:#1B3440; --ink:#E4EEF0; --ink-2:#9BB2BB;
  --line:#26404B; --line-2:#44616D; --accent:#4DC2B1; --accent-ink:#06281F; --accent-soft:#1B4744;
  --field:#1D2C31; --we:#182A33; --today-tint:#173B3C; --warn:#E0A85A; --danger:#EF8A7A; --shadow:none;
  --b-sky1:#1D4850; --b-sky2:#2E6460; --b-hill:#2F6B55; --b-soil1:#7B503A; --b-soil2:#4A3125; --b-soil-hi:#946248;
  --b-leaf1:#86D88A; --b-leaf2:#3FA169; --b-trunk1:#B98258; --b-trunk2:#7E5338; --b-seed:#D19A52;
  --b-fruit:#F0703F; --b-bloom:#F7B9C9; --b-ring1:#F1CF78; --b-ring2:#D09A33; --b-ringin:#112830; --b-sun:#F5C95F;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin-inline:auto;padding-bottom:110px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px}
.brand{display:flex;align-items:baseline;gap:8px;font:700 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.brand b{color:var(--accent)}
.navrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font:800 25px/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.ttl p{margin:3px 0 0;color:var(--ink-2);font-size:13px}
.ic{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill{height:34px;padding:0 13px;border-radius:17px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;flex:none}

/* banners + buttons */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner span{flex:1 1 220px;min-width:0}
.banner.warn{border-color:var(--warn)}
.btn{min-height:42px;padding:0 16px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px 8px;box-shadow:var(--shadow)}
.cards{columns:2 360px;column-gap:14px}
.cards>.card{break-inside:avoid;margin:0 0 14px}
.cards>.prog,.cards>.editinfo{column-span:all}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start;margin-top:14px}
.gh{font:700 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:14px 0 4px}
.para{margin:6px 0;color:var(--ink-2)}
.meta{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.err{color:var(--danger);margin:8px 0 0;font-size:14px}
.confirm{margin-top:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--field)}
.confirm p{margin:0}
.srcnote{margin:0 0 4px;font-size:12.5px;color:var(--ink-2)}

/* progress */
.prog{padding:14px 16px 16px;display:grid;gap:12px}
.prog-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font:800 46px/1 var(--f-display);letter-spacing:-.02em}
.big small{font:500 18px var(--f-body);color:var(--ink-2);margin-left:6px;letter-spacing:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s}
.sub{color:var(--ink-2);font-size:14px}
.streak{display:flex;gap:10px;align-items:center;margin-top:-2px}
.streak svg,.streak .bsvg{width:30px;height:37px;flex:none}

/* rows */
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding-block:6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1 1 0;min-width:0}
.row label.tx{cursor:pointer;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.hint{color:var(--ink-2);font-size:12.5px}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;margin:0;border:2px solid var(--line-2);border-radius:7px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
.row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.row input[type=checkbox]:checked::after{content:"";width:12px;height:6px;border-left:3px solid var(--accent-ink);border-bottom:3px solid var(--accent-ink);transform:translate(0,-2px) rotate(-45deg)}
input[type=text],input[type=time],input[type=number],select,textarea{font:16px var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea{resize:vertical;min-height:72px;line-height:1.4}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row .grow{flex:1;min-width:0}
.note{flex:0 1 42%;min-width:96px}
.tm{width:106px}
.pt{font:800 18px var(--f-display);font-variant-numeric:tabular-nums;flex:none;color:var(--ink)}
.pt.est{font-weight:700;color:var(--ink-2)}
.pt.est::before{content:"≈ ";font-weight:500}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step input{width:76px;text-align:center;padding-inline:4px}
.sb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.row .bar{height:4px;margin-top:7px;max-width:240px}
.row.sleep{flex-wrap:wrap}
.row.sleep .tx{flex:1 1 140px}
.times{display:flex;gap:10px;flex:none}
.times label{display:grid;gap:2px}
.gin{width:96px;text-align:center}
select.gin{width:150px;text-align:left}
.lbl2{font-size:14px;margin:6px 0 8px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;min-height:46px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;font:800 17px var(--f-display);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rv{display:grid;gap:4px;margin:10px 0}
.rv label{font-size:13px;font-weight:700;color:var(--ink)}

/* edit mode */
.editinfo{background:var(--accent-soft);border-color:var(--accent);display:grid;gap:10px;padding:14px 16px}
.editinfo p{margin:0}
.ed{padding-block:8px;border-bottom:1px solid var(--line)}
.edl{display:flex;align-items:center;gap:8px;min-height:42px}
.edl .grow{flex:1;min-width:0}
.edl .q{flex:1;min-width:0;font-size:14px}
.tr{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--danger);display:grid;place-items:center;cursor:pointer}
.tr svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edx{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.edx label{display:grid;gap:2px;flex:1 1 80px;min-width:72px}
.edx .hint{font-size:12px}
.edx input{min-height:38px;padding:6px 8px}
.addform{margin:8px 0 6px;padding:12px;border:1px dashed var(--line-2);border-radius:10px;background:var(--field)}
.addform input[type=text],.addform input[type=number]{background:var(--surface)}
.typ{display:flex;gap:16px;margin:10px 0 2px;flex-wrap:wrap}
.typ label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.typ input{width:18px;height:18px;accent-color:var(--accent)}
.addbtn{margin:8px 0 6px}

/* badges */
.bsvg{display:block;width:100%;height:auto}
.hero{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center;padding:16px}
.hero .bsvg{width:140px}
.sp{display:flex;gap:12px;padding:6px 0 12px}
.sp button{flex:1;display:grid;justify-items:center;gap:4px;padding:10px 8px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;font:700 14px var(--f-body);cursor:pointer}
.sp button .bsvg{width:84px}
.sp button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.sp button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero.off .bsvg{filter:grayscale(1);opacity:.4}
.hero h2{margin:0;font:800 24px/1.15 var(--f-display)}
.hero .sub{margin:4px 0 10px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;display:grid;justify-items:center;gap:2px;box-shadow:var(--shadow)}
.bd .bsvg{width:112px}
.bd .bn{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.bd .bt{font:800 17px var(--f-display)}
.bd .bs{font-size:12.5px;color:var(--ink-2)}
.bd.off .bsvg{filter:grayscale(1);opacity:.38}
.bd.off .bn{color:var(--ink-2)}
@media (max-width:520px){.bd:last-child{grid-column:1/-1}}
.ovl{position:fixed;inset:0;z-index:30;background:rgba(8,22,28,.62);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-card{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px 20px;text-align:center;display:grid;gap:8px;justify-items:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.ov-card .bsvg{width:210px}
.ov-k{font:700 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.ov-card h2{margin:0;font:800 26px/1.1 var(--f-display)}
.ov-card p{margin:0 0 8px;color:var(--ink-2)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}

/* grids */
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:14px;box-shadow:var(--shadow)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.grid th,.grid td{padding:0;text-align:center;height:38px;border-bottom:1px solid var(--line)}
.grid tbody tr:last-child td{border-bottom:0}
.grid .lbl{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 10px 0 12px;white-space:nowrap;min-width:140px;max-width:200px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.grid .lbl small{color:var(--ink-2);font-size:11px;margin-left:4px}
.grid thead th{background:var(--surface-2);height:48px;border-bottom:2px solid var(--accent);font-weight:400}
.grid thead .lbl{font:700 11px var(--f-body);letter-spacing:.14em;color:var(--accent)}
.dh span{display:block;font-size:10px;letter-spacing:.1em;color:var(--ink-2)}
.dh b{font:800 14px var(--f-display)}
.dh.today{background:var(--accent);color:var(--accent-ink)}
.dh.today span{color:inherit}
.grid tr.gr td{background:var(--surface-2);height:26px;font:700 10.5px var(--f-body);letter-spacing:.14em;color:var(--accent);text-align:left;padding-left:12px;border-bottom:0}
.grid tr.gr .lbl{background:var(--surface-2)}
.grid td.we{background:var(--we)}
.grid td.today{background:var(--today-tint)}
.w td,.w th.dh{min-width:34px}
.w .lbl{white-space:normal;min-width:108px;max-width:108px;line-height:1.2;font-size:12.5px}
.w .lbl small{display:block;margin:0}
.w .tot{min-width:50px;padding:0 5px}
.m td,.m th.dh{min-width:28px}
.grid .tot{min-width:58px;padding:0 8px;font-weight:700;border-left:1px solid var(--line);white-space:nowrap}
.grid thead .tot{font:700 10px var(--f-body);letter-spacing:.1em;color:var(--accent)}
.cell{display:block;position:relative;width:100%;height:100%;min-height:38px;padding:0;border:0;background:transparent;cursor:pointer}
.cell::before{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:1.8px solid var(--line-2);border-radius:5px}
.m .cell::before{width:15px;height:15px}
.cell.on::before{background:var(--accent);border-color:var(--accent)}
.cell.on::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:5px;border-left:2.2px solid var(--accent-ink);border-bottom:2.2px solid var(--accent-ink);transform:translate(-50%,-65%) rotate(-45deg)}
.m .cell.on::after{width:8px;height:4px}
a.nv{display:flex;align-items:center;justify-content:center;height:26px;margin:6px 3px;border-radius:6px;background:var(--field);color:var(--ink);text-decoration:none;font-size:12px}
.m a.nv{margin:6px 2px;font-size:11px}
a.nv.met{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sum3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px;padding:14px 16px 16px}
.sum3 .k{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.sum3 .v{font:800 20px/1.2 var(--f-display);margin-top:2px}
.sum3 .n{font-size:13px;color:var(--ink-2)}
.legend{margin:10px 2px 0;font-size:12.5px;color:var(--ink-2)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{display:flex;gap:2px;max-width:640px;margin-inline:auto}
.tab{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;min-height:54px;padding-top:4px;text-decoration:none;color:var(--ink-2);font-size:11.5px;font-weight:500}
.tab .ico{width:50px;height:28px;border-radius:14px;display:grid;place-items:center}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--ink);font-weight:700}
.tab[aria-current=page] .ico{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90%;text-align:center}

/* v4 additions */
.tab .ico{width:44px}
.tab{font-size:11px}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.lv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lv .hint{flex:1 1 160px}
.sk{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 11.5px/18px var(--f-body);vertical-align:1px}
.sk:empty{display:none}
.dur{display:flex;align-items:center;gap:6px;flex:none}
.dur .f{display:grid;gap:1px;justify-items:center}
.dur .f input{width:56px;text-align:center;padding-inline:4px}
.dur .f span{font-size:11px;color:var(--ink-2)}
.dur .sb{width:46px;font-size:13px;font-weight:700}
.ln{margin:2px 0 10px}
/* heatmap */
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:12px 12px 6px}
.hm .wd{font:700 9.5px var(--f-body);letter-spacing:.1em;color:var(--ink-2);text-align:center;padding-bottom:2px}
.hm a{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;text-decoration:none;font:700 14px var(--f-display);color:var(--ink);background:color-mix(in srgb,var(--accent) calc(var(--p,0)*100%),var(--surface-2));border:2px solid transparent;position:relative}
.hm a.hi{color:var(--accent-ink)}
.hm a.fu{opacity:.45}
.hm a.nd{background:var(--surface-2);color:var(--ink-2)}
.hm a.td{border-color:var(--ink)}
.hm a.lv2{border:2px dashed var(--accent);background:transparent;color:var(--accent)}
.hm a small{position:absolute;bottom:2px;font:700 8.5px var(--f-body)}
.hm .ph{visibility:hidden}

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const TR_DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];

/* prayers are fixed: [id, label, key in the times table] */
const PRAYERS=[['n_sabah','Sabah namazı','imsak'],['n_ogle','Öğle namazı','ogle'],['n_ikindi','İkindi namazı','ikindi'],['n_aksam','Akşam namazı','aksam'],['n_yatsi','Yatsı namazı','yatsi']];
const BADGES=[
  {n:1,name:'Tohum',msg:'İlk gün tamam. Her büyük ağaç bir tohumla başlar.'},

  {n:5,name:'Fide',msg:'İlk yapraklar açıldı, kökler tutunuyor.'},

];

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const nf=(v,d)=>{d=d==null?1:d;let x=Number(v).toFixed(d);if(d>0&&x.indexOf('.')>=0)x=x.replace(/\.?0+$/,'');const p=x.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return p.join(',');};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const NOW=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y0)/864e5+1)/7);}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function getPath(o,p){const s=p.split('.');for(let i=0;i<s.length;i++){if(o==null)return undefined;o=o[s[i]];}return o;}
function setPath(o,p,v){const s=p.split('.');for(let i=0;i<s.length-1;i++){if(o[s[i]]==null)o[s[i]]=/^\d+$/.test(s[i+1])?[]:{};o=o[s[i]];}const l=s[s.length-1];if(v===undefined)delete o[l];else o[l]=v;}
function sleepHours(dd){const s=dd&&dd.sleep;if(!s||!s.in||!s.out)return null;const a=s.in.split(':').map(Number),b=s.out.split(':').map(Number);let m=(b[0]*60+b[1])-(a[0]*60+a[1]);if(m<=0)m+=1440;return m/60;}
const fmtDur=h=>{const m=Math.round(h*60);return Math.floor(m/60)+' sa'+(m%60?' '+(m%60)+' dk':'');};
const hmShort=h=>{const m=Math.round(h*60);return Math.floor(m/60)+':'+pad(m%60);};
const newId=()=>'t'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);

/* ---------- prayer times: Kocaeli ---------- */
/* Kasım 2026: Diyanet vakitleri (İmsak, Güneş, Öğle, İkindi, Akşam, Yatsı). The table was cross-checked
   against an independent solar calculation (largest difference 1 minute). Other days use that calculation
   with Diyanet's usual per-prayer offsets and are shown with a ≈ sign. */
const DIY={'2026-11':[
['05:58','07:23','12:49','15:38','18:05','19:25'],
['05:59','07:24','12:49','15:37','18:03','19:24'],
['06:00','07:26','12:49','15:36','18:02','19:23'],

['06:14','07:42','12:50','15:25','17:48','19:11'],

['06:18','07:47','12:51','15:22','17:45','19:09'],
['06:19','07:48','12:51','15:22','17:45','19:08'],
['06:20','07:49','12:52','15:21','17:44','19:08'],
['06:21','07:50','12:52','15:21','17:44','19:07'],

]};
const LAT=40.7654,LON=29.9408,TZ=3,D2R=Math.PI/180;
const OFF={imsak:0,gunes:-7,ogle:5,ikindi:4,aksam:8,yatsi:0};
function sunPos(j){
  const D=j-2451545,g=(((357.529+0.98560028*D)%360)+360)%360,q=(((280.459+0.98564736*D)%360)+360)%360;
  const L=(((q+1.915*Math.sin(g*D2R)+0.020*Math.sin(2*g*D2R))%360)+360)%360,e=23.439-0.00000036*D;
  let RA=Math.atan2(Math.cos(e*D2R)*Math.sin(L*D2R),Math.cos(L*D2R))/D2R/15;RA=((RA%24)+24)%24;

function angTime(angle,decl){

  v=Math.max(-1,Math.min(1,v));return Math.acos(v)/D2R/15;

function calcTimes(d){
  const jd0=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+2440587.5,j=jd0+0.5-TZ/24,sp=sunPos(j),decl=sp[0],eqt=sp[1];

  const out={};
  for(const k in raw){const m=Math.round(raw[k]*60+OFF[k]);out[k]=pad(Math.floor(m/60))+':'+pad(m%60);}

}
function prayerTimes(k){
  const d=parseKey(k),tab=DIY[k.slice(0,7)],row=tab&&tab[d.getDate()-1];
  if(row)return {src:'diyanet',imsak:row[0],gunes:row[1],ogle:row[2],ikindi:row[3],aksam:row[4],yatsi:row[5]};
  return Object.assign({src:'calc'},calcTimes(d));
}

/* ---------- default tasks ---------- */
function defaultTasks(g){
  g=g||{};const su=g.su||2,adim=g.adim||10000,uyku=g.uyku||7.5;

function updateTask(t){
  const p=t.dataset.task.split(':'),f=findItem(p[0]);if(!f)return;
  const it=f.it,fld=p[1],n=parseFloat(String(t.value).replace(',','.'));
  if(fld==='t')it.t=t.value.slice(0,60);
  else if(fld==='unit')it.unit=t.value.slice(0,16);
  else if(fld==='step'){if(n>0)it.step=n;}
  else if(fld==='goal'){if(n>0)it.goal=n;else if(t.value.trim()==='')delete it.goal;}
  else if(fld==='wk'){const w=parseInt(t.value,10);if(w>=1&&w<=6){it.wk=w;delete it.days;}else delete it.wk;save();checkBadges();render();return;}
  save();
}
function addTask(){
  const g=S.tasks.find(x=>x.id===ui.addTo);if(!g)return;
  const nameEl=$('add-name'),name=(nameEl.value||'').trim().slice(0,60);
  if(!name){nameEl.focus();toast('Görev adını yaz');return;}
  let it={id:newId(),t:name,type:'check'};
  const typ=view.querySelector('input[name="add-type"]:checked');
  if(g.id==='g_takip'&&typ&&typ.value==='num'){
    const st=parseFloat(($('add-step').value||'').replace(',','.')),gl=parseFloat(($('add-goal').value||'').replace(',','.'));
    it={id:it.id,t:name,type:'num',unit:($('add-unit').value||'').trim().slice(0,16)||'adet',step:st>0?st:1};
    if(gl>0)it.goal=gl;
  }
  g.items.push(it);ui.addTo=null;save();render();toast('Görev eklendi');
}

function itemRow(it){
  if(it.type==='check')return {kind:'check',id:it.id,t:it.t,days:it.days};
  if(it.type==='sleep')return {kind:'num',days:it.days,id:it.id,t:it.t,unit:'saat',get:d=>sleepHours(d),agg:'avg',goal:()=>it.goal||0,show:v=>nf(v,1)};
  const big=(it.step||1)>=100,hr=it.unit==='saat';
  return {kind:'num',days:it.days,id:it.id,t:it.t,unit:big?'bin':(it.unit||''),get:d=>d&&d.n?d.n[it.id]:undefined,agg:'sum',goal:it.goal?()=>it.goal:null,
    show:big?(v=>nf(v/1000,1)):hr?hmShort:(v=>nf(v,2)),totShow:big?(v=>nf(v/1000,1)+' b'):hr?fmtDur:null};
}
const PUAN_ROW={kind:'num',id:'puan',t:'Gün puanı (1–5)',unit:'',get:d=>d?d.score:undefined,agg:'avg',show:v=>String(v)};
const NAMAZ_GROUP=()=>({g:'NAMAZLAR',rows:PRAYERS.map(p=>({kind:'check',id:p[0],t:p[1]}))});
function taskGroups(withNamaz){
  const out=[];
  S.tasks.forEach(g=>{
    if(g.id==='g_takip'&&withNamaz)out.push(NAMAZ_GROUP());
    const rows=g.items.map(itemRow);
    if(g.id==='g_takip')rows.push(PUAN_ROW);
    if(rows.length)out.push({g:g.g,rows:rows});

function buildGrid(dates,groups,mode){
  const isM=mode==='m',today=keyOf(NOW()),n=dates.length;
  let h='<table class="grid '+mode+'"><thead><tr><th class="lbl">'+(isM?'ALIŞKANLIK':'')+'</th>';
  dates.forEach(d=>{
    const k=keyOf(d),wd=(d.getDay()+6)%7;
    h+='<th class="dh'+(k===today?' today':'')+'"><span>'+(isM?TR_DAYS_S[wd].charAt(0):TR_DAYS_S[wd])+'</span><b>'+d.getDate()+'</b></th>';
  });
  h+='<th class="tot">TOPLAM</th></tr></thead><tbody>';
  groups.forEach(g=>{
    h+='<tr class="gr"><td class="lbl">'+esc(g.g)+'</td><td colspan="'+(n+1)+'"></td></tr>';
    g.rows.forEach(r=>{
      const label=r.t;
      let tds='',sum=0,cnt=0,actN=0;
      dates.forEach(d=>{
        const k=keyOf(d),dd=S.days[k],wd=(d.getDay()+6)%7,cls=((k===today)?' today':'')+(wd>=5&&k!==today?' we':'');
        if(r.days&&r.days.length&&r.days.indexOf(wd)<0){tds+='<td class="'+cls+'"><span class="offc" title="Bu gün geçerli değil">·</span></td>';return;}
        actN++;
        if(r.kind==='check'){
          const on=!!(dd&&dd.c&&dd.c[r.id]);if(on)cnt++;
          tds+='<td class="'+cls+'"><button type="button" class="cell'+(on?' on':'')+'" data-r="'+r.id+'" data-d="'+k+'" aria-pressed="'+on+'" aria-label="'+esc(label)+', '+k+'"></button></td>';
        }else{
          const v=r.get(dd);if(v!=null){sum+=v;cnt++;}
          const met=r.goal&&v!=null&&r.goal()>0&&v>=r.goal();
          tds+='<td class="'+cls+'"><a class="nv'+(met?' met':'')+'" href="#bugun" data-day="'+k+'" aria-label="'+esc(label)+', '+k+(v==null?', boş':'')+'">'+(v==null?'':r.show(v))+'</a></td>';
        }
      });
      let tot='';
      if(r.kind==='check')tot=cnt+'/'+actN;
      else if(cnt)tot=r.agg==='avg'?'ort '+nf(sum/cnt,1):(r.totShow?r.totShow(sum):nf(sum,1));
      h+='<tr><td class="lbl" title="'+esc(label)+'">'+esc(label)+(r.unit?'<small>'+esc(r.unit)+'</small>':'')+'</td>'+tds+'<td class="tot">'+tot+'</td></tr>';
    });
  });
  return h+'</tbody></table>';
}

function insights(dates){
  const t=NOW(),el=dates.filter(d=>d<=t);if(!el.length)return null;
  const list=checkList();if(!list.length)return null;
  const cnt={};list.forEach(c=>{cnt[c.id]=0;});
  el.forEach(d=>{const dd=S.days[keyOf(d)];if(dd&&dd.c)for(const id in dd.c)if(dd.c[id]&&cnt[id]!==undefined)cnt[id]++;});
  const arr=list.map(c=>({t:c.t,n:cnt[c.id]})).sort((a,b)=>b.n-a.n);
  return {days:el.length,best:arr[0],worst:arr[arr.length-1]};
}

/* ---------- Görevler: tek seferlik + aylık ---------- */
const todayK=()=>keyOf(NOW());
const dmShort=k=>{const d=parseKey(k),w=TR_DAYS_S[(d.getDay()+6)%7];return d.getDate()+' '+TR_MON_S[d.getMonth()]+' '+w.charAt(0)+w.slice(1).toLowerCase();};
const dayDiff=k=>Math.round((parseKey(k)-NOW())/864e5);
const rel=k=>{const n=dayDiff(k);return n===0?'bugün':n===1?'yarın':n>1?n+' gün kaldı':(-n)+' gün gecikti';};
const mById=id=>S.mtasks.find(m=>m.id===id);
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const todoItem=x=>({kind:'todo',id:x.id,t:x.t,done:!!x.done,date:x.date});
const occItem=o=>({kind:'occ',id:o.id,t:(mById(o.mid)||{}).t||'',done:!!o.done,date:o.date,mid:o.mid});
function genMonthly(){
  const t=NOW(),tk=keyOf(t);let ch=false;
  [0,1].forEach(off=>{
    const d=new Date(t.getFullYear(),t.getMonth()+off,1),ym=ymOf(d),nd=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    S.mtasks.forEach(m=>{
      if(!(m.def>0))return;const key=m.id+'|'+ym;if(S.mgen[key])return;
      S.mgen[key]=1;ch=true;
      const date=ym+'-'+pad(Math.min(m.def,nd));
      if(date<tk)return;
      if(!S.moccs.some(o=>o.mid===m.id&&o.date.slice(0,7)===ym))S.moccs.push({id:newId(),mid:m.id,date:date,done:false});
    });
  });
  if(ch)save();
}
function itemsOn(k){
  return S.todos.filter(x=>x.date===k).map(todoItem).concat(S.moccs.filter(o=>o.date===k&&mById(o.mid)).map(occItem)).concat(recOn(k));
}
function overdueItems(){
  const t=todayK(),lim=keyOf(addDays(NOW(),-31));
  return S.todos.filter(x=>x.date&&x.date<t&&!x.done).map(todoItem)
    .concat(S.moccs.filter(o=>o.date<t&&o.date>=lim&&!o.done&&mById(o.mid)).map(occItem)).sort((a,b)=>a.date<b.date?-1:1);
}
const delBtn=(it)=>it.kind==='todo'?'<button type="button" class="xb" data-act="todo-menu" data-id="'+it.id+'" aria-expanded="'+(ui.menuTodo===it.id)+'" aria-label="Seçenekler: '+esc(it.t)+'">⋯</button>':'';
function todoMenu(it,o){
  if(it.kind!=='todo'||ui.menuTodo!==it.id||!o.act||o.act.indexOf('todo-menu')<0)return '';
  if(ui.editTodo===it.id)return '<div class="tmenu"><input type="text" id="te-name" maxlength="120" value="'+esc(it.t)+'" aria-label="Görev adı"><input type="date" id="te-date" value="'+(it.date||'')+'" aria-label="Tarih"><button type="button" class="btn sm" data-act="todo-save" data-id="'+it.id+'">Kaydet</button><button type="button" class="btn ghost sm" data-act="todo-menu" data-id="'+it.id+'">Vazgeç</button></div>';
  return '<div class="tmenu"><button type="button" class="btn ghost sm" data-act="todo-tom" data-id="'+it.id+'">Yarına ertele</button><button type="button" class="btn ghost sm" data-act="todo-week" data-id="'+it.id+'">1 hafta ertele</button><button type="button" class="btn ghost sm" data-act="todo-timer" data-id="'+it.id+'">Sayaçla çalış</button><button type="button" class="btn ghost sm" data-act="todo-edit" data-id="'+it.id+'">Düzenle</button><button type="button" class="btn danger sm" data-act="todo-del" data-id="'+it.id+'">Sil</button></div>';
}
function recOn(k){
  if(!S.rtasks.length)return [];
  const d=parseKey(k),w=dowOf(k),mon=mondayOf(d);
  return S.rtasks.filter(r=>k>=r.from&&r.dow.indexOf(w)>=0&&(r.every!==2||Math.round((mon-parseKey(r.start))/6048e5)%2===0))
    .map(r=>({kind:'rec',id:r.id+'@'+k,t:r.t,done:!!S.rdone[r.id+'@'+k],date:k}));
}
function taskRow(it,o){
  o=o||{};const late=it.date&&it.date<todayK()&&!it.done,id='td-'+it.kind+it.id;
  const meta=o.meta!=null?'<span class="hint">'+o.meta+'</span>':o.noDate?'':'<span class="hint'+(late?' late':'')+'">'+(it.date?dmShort(it.date)+' · '+rel(it.date):'Bu hafta')+'</span>';

}

function missingCard(){
  if(cur.day!==todayK()||!S.mtasks.length)return '';
  const t=NOW(),months=[new Date(t.getFullYear(),t.getMonth(),1)];

function weekTasksCard(mon){

  dates.forEach(d=>{const k=keyOf(d),its=itemsOn(k);if(its.length)h+='<div class="gh2">'+TR_DAYS[(d.getDay()+6)%7].toUpperCase()+' '+d.getDate()+'</div>'+its.map(it=>taskRow(it,{noDate:true,act:delBtn(it)})).join('');});

  if(un.length)h+='<div class="gh2">GÜNÜ BELLİ DEĞİL</div>'+un.map(x=>taskRow(todoItem(x),{noDate:true,act:'<select data-assign="'+x.id+'" style="width:auto" aria-label="Gün ata"><option value="">Gün ata</option>'+dates.map(d=>'<option value="'+keyOf(d)+'">'+TR_DAYS_S[(d.getDay()+6)%7]+' '+d.getDate()+'</option>').join('')+'</select>'+delBtn(todoItem(x))})).join('');

const MONS=['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
function parseQuick(raw){
  let s=' '+String(raw).trim()+' ',low=s.toLocaleLowerCase('tr'),date=null;const T0=NOW();
  if(low.length!==s.length)return {t:String(raw).trim(),date:null};
  const cut=re=>{const m=low.match(re);if(!m)return null;const i=m.index,L=m[0].length;s=s.slice(0,i)+' '+s.slice(i+L);low=low.slice(0,i)+' '+low.slice(i+L);return m;};
  const mk=(y,mo,d)=>{const x=new Date(y,mo,d);return (x.getMonth()===mo&&x.getDate()===d)?x:null;};
  let m;
  if((m=low.match(/\s(\d{1,2})[./](\d{1,2})(?:[./](\d{4}))?\s/))){let x=mk(m[3]?+m[3]:T0.getFullYear(),+m[2]-1,+m[1]);if(x&&!m[3]&&x<T0)x=mk(T0.getFullYear()+1,+m[2]-1,+m[1]);if(x){date=x;cut(/\s(\d{1,2})[./](\d{1,2})(?:[./](\d{4}))?\s/);}}
  const reM=/\s(\d{1,2})\s+(ocak|şubat|mart|nisan|mayıs|haziran|temmuz|ağustos|eylül|ekim|kasım|aralık|oca|şub|mar|nis|may|haz|tem|ağu|eyl|eki|kas|ara)(?:'?(?:da|de|ta|te|ya|ye|a|e))?\s/;
  if(!date&&(m=low.match(reM))){const mo=MONS.findIndex(x=>x.slice(0,3)===m[2].slice(0,3));let x=mk(T0.getFullYear(),mo,+m[1]);if(x&&x<T0)x=mk(T0.getFullYear()+1,mo,+m[1]);if(x){date=x;cut(reM);}}
  if(!date&&(m=cut(/\s(bugün|yarın|öbür gün|yarından sonra)\s/)))date=addDays(T0,m[1]==='bugün'?0:m[1]==='yarın'?1:2);
  if(!date&&(m=cut(/\s(\d{1,2})\s+gün\s+sonra\s/)))date=addDays(T0,+m[1]);
  if(!date&&(m=cut(/\s(\d)\s+hafta\s+sonra\s/)))date=addDays(T0,7*+m[1]);
  const DW=['pazartesi','salı','çarşamba','perşembe','cuma','cumartesi','pazar'];
  if(!date&&(m=cut(/\s(haftaya\s+|gelecek hafta\s+)?(pazartesi|salı|çarşamba|perşembe|cumartesi|cuma|pazar)(?:\s+günü)?(?:'?(?:ya|ye|a|e|da|de))?\s/))){
    const w=DW.indexOf(m[2]);if(m[1])date=addDays(mondayOf(T0),7+w);else{let df=(w-((T0.getDay()+6)%7)+7)%7;if(df===0)df=7;date=addDays(T0,df);}}
  if(!date&&cut(/\s(haftaya|gelecek hafta)\s/))date=addDays(T0,7);
  let t=s.replace(/\s+/g,' ').trim().replace(/^[,;:\-]+\s*|\s*[,;:\-]+$/g,'');
  if(!t)return {t:String(raw).trim(),date:null};
  if(date)t=t.charAt(0).toLocaleUpperCase('tr')+t.slice(1);
  return {t:t,date:date?keyOf(date):null};
}

function applyBind(t){
  const parts=t.dataset.bind.split(':'),scope=parts[0],path=parts[1];let v;
  if(t.type==='checkbox')v=t.checked?true:undefined;
  else if(t.dataset.kind==='num'){const s=t.value.replace(',','.').trim(),n=parseFloat(s);v=(s===''||isNaN(n)||n<0)?undefined:n;}
  else v=t.value===''?undefined:t.value;
  if(scope==='goal'){
    if(v===undefined)return;
    if(path==='completeAt'){if(v<10||v>100)return;v=Math.round(v);}
    S.goals[path]=v;save();afterChange();return;
  }
  setPath(scopeObj(scope,true),path,v);save();afterChange();
}
view.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.bind)applyBind(t);
  else if(t.dataset&&t.dataset.ns){noteSearch(t.value);}
  else if(t.dataset&&t.dataset.tn){const n=+t.dataset.tn;TMS()[n].name=t.value.trim().slice(0,20)||('Sayaç '+(n+1));save();gUI();}
  else if(t.dataset&&t.dataset.gd){const bx=t.closest('.dur'),i=+bx.dataset.gdur,c=TMS()[i+1],m=Math.max(0,parseInt(bx.querySelector('[data-gd=m]').value,10)||0),sc=Math.max(0,parseInt(bx.querySelector('[data-gd=s]').value,10)||0),d=Math.min(86400,m*60+sc);

const dlP=Promise.resolve({save:async o=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([o.data],{type:/\.ics$/.test(o.filename)?'text/calendar':/\.csv$/.test(o.filename)?'text/csv;charset=utf-8':'application/json'}));a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);}});
function icsEsc(x){return String(x).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function buildIcs(){
  const dt=k=>k.replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),tk=todayK(),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gunluk Rutin//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  let n=0;
  const ev=(uid,k,title,rr)=>{n++;L.push('BEGIN:VEVENT','UID:'+uid+'@gunluk-rutin','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dt(k),'DTEND;VALUE=DATE:'+dt(keyOf(addDays(parseKey(k),1))),'SUMMARY:'+icsEsc(title));if(rr)L.push(rr);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:PT9H','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Yarın: '+title),'TRIGGER:-PT4H','END:VALARM','END:VEVENT');};
  S.todos.forEach(x=>{if(!x.done&&x.date&&x.date>=tk)ev('t-'+x.id,x.date,x.t);});
  S.moccs.forEach(o=>{const m=mById(o.mid);if(m&&!o.done&&o.date>=tk)ev('m-'+o.id,o.date,m.t);});
  const BY=['MO','TU','WE','TH','FR','SA','SU'];
  S.rtasks.forEach(r=>{let first=null;for(let i=0;i<21&&!first;i++){const k=keyOf(addDays(NOW(),i));if(recOn(k).some(x=>x.id===r.id+'@'+k))first=k;}
    if(first)ev('r-'+r.id,first,r.t,'RRULE:FREQ=WEEKLY;INTERVAL='+(r.every===2?2:1)+';WKST=MO;BYDAY='+r.dow.map(d=>BY[d]).join(','));});
  L.push('END:VCALENDAR');return {text:L.join('\r\n')+'\r\n',n:n};
}
async function exportIcs(){
  const o=buildIcs();if(!o.n){toast('Aktarılacak açık görev yok');return;}
  const dl=await dlP;if(!dl){toast('Bu ortamda dosya indirilemiyor');return;}
  try{await dl.save({filename:'gunluk-rutin-gorevler.ics',data:o.text});toast(o.n+' görev takvim dosyasına yazıldı. Dosyayı açınca takvime eklenir.');}
  catch(err){toast(err&&err.code==='declined'?'İptal edildi':'Takvim dosyası indirilemedi');}
}
const backupData=()=>JSON.stringify({app:'gunluk-rutin',version:2,exportedAt:new Date().toISOString(),goals:S.goals,tasks:S.tasks,badges:S.badges,days:S.days,weeks:S.weeks,todos:S.todos,mtasks:S.mtasks,moccs:S.moccs,mgen:S.mgen,rtasks:S.rtasks,rdone:S.rdone},null,2);
function applyTheme(){const t=S.goals.theme,r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');}
function buildCsv(){
  const its=allItems(),cols=['Tarih','Gün','Tamamlama %','İzin günü'];
  its.forEach(it=>cols.push(it.t+(it.type==='num'&&it.unit?' ('+it.unit+')':it.type==='sleep'?' (saat)':'')));
  PRAYERS.forEach(p=>cols.push(p[1]));cols.push('Gün puanı','Hızlı not','Gün sonu notu','Odak oturumu','Odak dakika','Görev tamamlanan','Görev toplam');
  const cell=v=>{v=v==null?'':String(v);if(/^[=+\-@]/.test(v))v="'"+v;return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const num=v=>v==null?'':String(Math.round(v*100)/100).replace('.',',');
  const rows=[cols.map(cell).join(';')];
  Object.keys(S.days).sort().forEach(k=>{
    const dd=S.days[k],d=parseKey(k),st=dayStats(k),r=[k,TR_DAYS[(d.getDay()+6)%7],st.total?Math.round(st.done/st.total*100):'',dd.leave?'evet':''];
    its.forEach(it=>{if(it.type==='check')r.push(activeOn(it,k)?(dd.c&&dd.c[it.id]?1:0):'');else if(it.type==='sleep')r.push(num(sleepHours(dd)));else r.push(num(dd.n?dd.n[it.id]:null));});
    PRAYERS.forEach(p=>r.push(dd.c&&dd.c[p[0]]?1:0));
    const ts=itemsOn(k);r.push(dd.score||'',dd.ln||'',dd.dnote||'',dd.pm||'',dd.pmm||'',ts.filter(x=>x.done).length,ts.length);
    rows.push(r.map(cell).join(';'));
  });
  return '\ufeff'+rows.join('\r\n')+'\r\n';
}
async function exportCsv(){
  if(!Object.keys(S.days).length){toast('Aktarılacak kayıt yok');return;}
  const dl=await dlP;if(!dl){toast('Bu ortamda dosya indirilemiyor');return;}
  try{await dl.save({filename:'gunluk-rutin-tablo-'+keyOf(NOW())+'.csv',data:buildCsv()});toast('Tablo indirildi');}
  catch(err){toast(err&&err.code==='declined'?'İptal edildi':'Tablo indirilemedi');}
}
function noteSearch(qv){
  const out=$('ns-out');if(!out)return;const ql=qv.trim().toLocaleLowerCase('tr');if(ql.length<2){out.innerHTML='';return;}
  const res=[],hit=x=>String(x).toLocaleLowerCase('tr').indexOf(ql)>=0,add=(k,lb,tx)=>{if(res.length<40&&tx&&hit(tx))res.push([k,lb,String(tx)]);};
  Object.keys(S.days).sort().reverse().forEach(k=>{const dd=S.days[k];add(k,'Not',dd.ln);add(k,'Gün sonu',dd.dnote);if(dd.prio)Object.keys(dd.prio).forEach(i=>{const p=dd.prio[i];if(p)add(k,'Öncelik',p.t);});});
  Object.keys(S.weeks).sort().reverse().forEach(k=>{const w=S.weeks[k];add(k,'Hafta: iyi giden',w.iyi);add(k,'Hafta: aksayan',w.aksadi);add(k,'Hafta: taşınan',w.tasinan);});
  S.todos.forEach(x=>{if(x.date)add(x.date,'Görev',x.t);});
  const hl=tx=>{const i=tx.toLocaleLowerCase('tr').indexOf(ql),a=Math.max(0,i-40);return (a?'…':'')+esc(tx.slice(a,i))+'<mark>'+esc(tx.slice(i,i+ql.length))+'</mark>'+esc(tx.slice(i+ql.length,i+ql.length+90))+(tx.length>i+ql.length+90?'…':'');};
  out.innerHTML=res.length?res.map(r=>'<a class="nt nsr" href="#bugun" data-day="'+r[0]+'"><b>'+dmShort(r[0])+' '+r[0].slice(0,4)+' · '+r[1]+'</b>'+hl(r[2])+'</a>').join(''):'<p class="srcnote" style="padding:8px 0">Sonuç yok.</p>';
}
function canShareFile(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['{}'],'a.json',{type:'application/json'})]}));}catch(e){return false;}}
async function shareBackup(){
  try{const f=new File([backupData()],'gunluk-rutin-yedek-'+keyOf(NOW())+'.json',{type:'application/json'});
    await navigator.share({files:[f],title:'Günlük Rutin yedeği'});S.goals.lastBackup=keyOf(NOW());flush();toast('Yedek paylaşıldı');renderBanner();}
  catch(e){if(!e||e.name!=='AbortError')toast('Paylaşılamadı, “Yedek dosyası indir”i dene');}
}
async function doBackup(){
  const data=JSON.stringify({app:'gunluk-rutin',version:2,exportedAt:new Date().toISOString(),goals:S.goals,tasks:S.tasks,badges:S.badges,days:S.days,weeks:S.weeks,todos:S.todos,mtasks:S.mtasks,moccs:S.moccs,mgen:S.mgen,rtasks:S.rtasks,rdone:S.rdone},null,2);
  const dl=await dlP;
  if(!dl){ui.json=data;S.goals.lastBackup=keyOf(NOW());flush();renderBackup();return;}
  try{await dl.save({filename:'gunluk-rutin-yedek-'+keyOf(NOW())+'.json',data:data});S.goals.lastBackup=keyOf(NOW());flush();toast('Yedek kaydedildi');}
  catch(err){if(err&&err.code==='declined')toast('İptal edildi');else{ui.json=data;renderBackup();}}
}
function act(a,el){
  if(taskAct(a,el))return;
  if(a==='leave'){
    const k=cur.day,dd=S.days[k]||(S.days[k]={});
    if(dd.leave)delete dd.leave;
    else{const o=leaveInWeek(k);if(o){const d=parseKey(o);toast('Bu haftanın izin günü zaten '+d.getDate()+' '+TR_MON_S[d.getMonth()]+' günü kullanıldı');return;}dd.leave=true;}
    save();checkBadges();render();return;
  }
  if(a.indexOf('tm-')===0){tmAct(a,el);return;}
  if(a==='style'){S.goals.style=el.dataset.v==='gece'?'gece':'gumus';save();renderSprite();render();return;}
  if(a==='clear-sample'){ui.clearSample=true;renderBanner();}
  else if(a==='clear-sample-no'){ui.clearSample=false;renderBanner();}
  else if(a==='clear-sample-yes'){S.days={};S.weeks={};S.badges={};S.todos=[];S.moccs=[];S.mgen={};S.rdone={};S.sample=false;ui.clearSample=false;flush();render();toast('Örnek veriler temizlendi');}
  else if(a==='edit-on'){ui.edit=true;render();window.scrollTo(0,0);}
  else if(a==='edit-off'){ui.edit=false;ui.addTo=null;ui.delId=null;render();window.scrollTo(0,0);}
  else if(a==='del'){ui.delId=el.dataset.id;ui.addTo=null;render();}
  else if(a==='del-no'){ui.delId=null;render();}
  else if(a==='del-yes'){
    S.tasks.forEach(g=>{g.items=g.items.filter(i=>i.id!==ui.delId);});
    ui.delId=null;save();render();toast('Görev silindi');
  }
  else if(a==='add-open'){ui.addTo=el.dataset.gid;ui.delId=null;render();const n=$('add-name');if(n)n.focus();}
  else if(a==='add-no'){ui.addTo=null;render();}
  else if(a==='add-yes')addTask();
  else if(a==='backup')doBackup();
  else if(a==='restore-yes'&&ui.restore){
    const o=ui.restore.obj;
    S=migrate({sample:false,goals:o.goals,tasks:o.tasks,badges:o.badges,days:o.days,weeks:o.weeks,todos:o.todos,mtasks:o.mtasks,moccs:o.moccs,mgen:o.mgen,rtasks:o.rtasks,rdone:o.rdone});
    ui.restore=null;flush();render();checkBadges();toast('Yedek geri yüklendi');
  }
  else if(a==='restore-no'){ui.restore=null;renderBackup();}
  else if(a==='wipe'){ui.wipe=true;renderBackup();}
  else if(a==='wipe-no'){ui.wipe=false;renderBackup();}
  else if(a==='wipe-yes'){S.days={};S.weeks={};S.badges={};S.todos=[];S.moccs=[];S.mgen={};S.rdone={};S.sample=false;ui.wipe=false;flush();render();toast('Kayıtlar silindi');}
  else if(a==='copy-json'){
    const box=q('#json-box'),sel=()=>{box.focus();box.select();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(box.value).then(()=>toast('Kopyalandı')).catch(sel);else sel();
  }
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a){act(a.dataset.act,a);return;}
  const da=e.target.closest('button[data-dadd]');
  if(da){const box=da.closest('.dur'),hi=box.querySelector('[data-part=h]'),mi=box.querySelector('[data-part=m]');
    let mins=Math.round(((parseFloat(hi.value)||0)*60+(parseFloat(mi.value)||0))+parseFloat(da.dataset.dadd));mins=Math.max(0,mins);
    hi.value=mins?Math.floor(mins/60):'';mi.value=mins?mins%60:'';setDur(box,true);return;}
  const sb=e.target.closest('button[data-step]');
  if(sb){
    const inp=sb.parentElement.querySelector('input'),cv=parseFloat((inp.value||'0').replace(',','.'))||0;
    inp.value=Math.max(0,Math.round((cv+parseFloat(sb.dataset.step))*100)/100);applyBind(inp);return;
  }
  const sc=e.target.closest('button[data-score]');
  if(sc){
    const n=+sc.dataset.score,o=scopeObj('day',true);
    if(o.score===n)delete o.score;else o.score=n;save();
    view.querySelectorAll('[data-score]').forEach(b=>b.setAttribute('aria-pressed',String(o.score===+b.dataset.score)));return;
  }
  const cell=e.target.closest('button.cell');if(cell){toggleCell(cell);return;}
  const lk=e.target.closest('a[data-day]');
  if(lk){e.preventDefault();cur.day=lk.dataset.day;if(location.hash==='#bugun')render();else location.hash='#bugun';}
});

applyTheme();
renderSprite();
route();
checkBadges();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
})();
</script>
